name: advanced_image_processing_toolkit
description: >-
  Fast, private, on-device image processing for Flutter. Chainable pipelines
  on background isolates, live GPU presets, .cube LUTs, face and text
  redaction, EXIF-safe output and ML Kit detection.
version: 0.3.0
homepage: https://github.com/emorilebo/advanced_image_processing
repository: https://github.com/emorilebo/advanced_image_processing
issue_tracker: https://github.com/emorilebo/advanced_image_processing/issues
documentation: https://github.com/emorilebo/advanced_image_processing#readme

screenshots:
  - description: An original photo split against the Golden Hour preset.
    path: doc/assets/hero.jpg
  - description: The 12 built-in presets, previewable live on the GPU.
    path: doc/assets/presets.jpg
  - description: Toolkit Studio, the example app, on desktop and phone.
    path: doc/assets/app.jpg

topics:
  - image-processing
  - image
  - filters
  - privacy
  - ml-kit

environment:
  # google_mlkit_* need Dart 3.8 / Flutter 3.32 at minimum.
  sdk: '>=3.8.0 <4.0.0'
  flutter: '>=3.32.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  plugin_platform_interface: ^2.1.7
  image: ^4.5.4
  logging: ^1.2.0

  # Individual ML Kit packages (the umbrella `google_ml_kit` bloats apps).
  # The 0.x and 1.x lines share the same Dart API; 1.x needs Flutter 3.44+,
  # so these ranges let older Flutter versions keep resolving 0.x.
  google_mlkit_commons: '>=0.11.0 <2.0.0'
  google_mlkit_object_detection: '>=0.15.0 <2.0.0'
  google_mlkit_text_recognition: '>=0.15.0 <2.0.0'
  google_mlkit_face_detection: '>=0.13.0 <2.0.0'
  google_mlkit_pose_detection: '>=0.14.0 <2.0.0'

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        package: dev.godfreylebo.advanced_image_processing_toolkit
        pluginClass: AdvancedImageProcessingToolkitPlugin
      ios:
        pluginClass: AdvancedImageProcessingToolkitPlugin
      web:
        pluginClass: AdvancedImageProcessingToolkitWeb
        fileName: advanced_image_processing_toolkit_web.dart
