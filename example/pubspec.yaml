name: advanced_image_processing_toolkit_example
description: Toolkit Studio — a private, on-device photo editing studio.
publish_to: 'none'

environment:
  sdk: '>=3.8.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  advanced_image_processing_toolkit:
    path: ../
  cupertino_icons: ^1.0.6
  image_picker: ^1.0.7
  path_provider: ^2.1.2

dev_dependencies:
  integration_test:
    sdk: flutter
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  # google_mlkit_* 1.x ship for iOS through Swift Package Manager only.
  config:
    enable-swift-package-manager: true
  uses-material-design: true
  assets:
    - assets/sample_image.jpg
    - assets/people_sample.jpg
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter.ttf
