name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  package:
    name: Package (stable)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: tool/ci/run_logged.sh flutter pub get
      - run: tool/ci/run_logged.sh dart format --output=none --set-exit-if-changed lib test tool
      - run: tool/ci/run_logged.sh flutter analyze
      - run: tool/ci/run_logged.sh flutter test
      - run: tool/ci/run_logged.sh flutter pub publish --dry-run

  minimum-versions:
    name: Package (Flutter 3.32, lowest dependencies)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.0'
          cache: true
      - run: tool/ci/run_logged.sh flutter pub downgrade
      - run: tool/ci/run_logged.sh flutter analyze lib test
      - run: tool/ci/run_logged.sh flutter test

  example:
    name: Example app
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: example
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: ../tool/ci/run_logged.sh flutter pub get
      - run: ../tool/ci/run_logged.sh flutter analyze
      - run: ../tool/ci/run_logged.sh flutter test
      - run: ../tool/ci/run_logged.sh flutter build web --release

  example-android:
    name: Example app (Android APK)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: example
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: ../tool/ci/run_logged.sh flutter build apk --debug

  example-ios:
    name: Example app (iOS simulator)
    runs-on: macos-latest
    defaults:
      run:
        working-directory: example
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: ../tool/ci/run_logged.sh flutter build ios --simulator --debug
