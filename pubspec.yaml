name: advanced_image_processing_toolkit
description: Flutter image processing toolkit with filters, geometric transforms, watermarking, ML-powered detection (objects, faces, text, pose), and AR hooks.
version: 0.2.0
homepage: https://github.com/emorilebo/advanced_image_processing
repository: https://github.com/emorilebo/advanced_image_processing
issue_tracker: https://github.com/emorilebo/advanced_image_processing/issues
documentation: https://github.com/emorilebo/advanced_image_processing#readme

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.3.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  plugin_platform_interface: ^2.1.7
  image: ^4.5.4
  logging: ^1.2.0

  # ML Kit — individual packages only (the umbrella `google_ml_kit` pulls in
  # every model and bloats consumer apps).
  google_mlkit_commons: ^0.11.0
  google_mlkit_object_detection: ^0.15.0
  google_mlkit_text_recognition: ^0.15.0
  google_mlkit_face_detection: ^0.13.0
  google_mlkit_pose_detection: ^0.14.0

  # NOTE: AR is opt-in. To use `AugmentedReality.*`, add to YOUR app's pubspec:
  #   arkit_plugin: ^1.1.0          # iOS
  #   arcore_flutter_plugin: ^0.1.0 # Android (community-maintained)
  # This package only wires the method channels; it does not bundle the AR SDKs.

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  plugin:
    platforms:
      android:
        package: dev.godfreylebo.advanced_image_processing_toolkit
        pluginClass: AdvancedImageProcessingToolkitPlugin
      ios:
        pluginClass: AdvancedImageProcessingToolkitPlugin
      web:
        pluginClass: AdvancedImageProcessingToolkitWeb
        fileName: advanced_image_processing_toolkit_web.dart
